  map: {Παῦλος: paulŏs, δέσμιος: bandī, Χριστός: khristū, Ἰησοῦς: iēsū, Τιμόθεος: timŏthĕŏs, ὁ: saḥ, ἀδελφός: bhrātā, Φιλήμων: philēmŏni, ἀγαπητός: priyāya, συνεργός: sahāyine, ἡμεῖς: asmākam}
