  map: {ὅπως: yathā, κοινωνία: saṃvibhāgaḥ, πίστις: śraddhāyāḥ, σύ: te, ἐνεργής: saphalaḥ, γίνομαι: bhavet, ἐπίγνωσις: jñāne, πᾶς: sarva-, ἀγαθός: śubha-, "ἐν ἡμῖν": asmāsu, "εἰς Χριστόν": "khristŏn prati"}
  fillers: [ca]
  added: {sa: renders the article ἡ}
  note: ἐπίγνωσις could be abhijñāna (fuller knowledge); jñāna chosen for metre. PENDING.
