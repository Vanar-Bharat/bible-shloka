  map: {Παῦλος: paulaḥ, δέσμιος: bandī, Χριστός: khrista-, Ἰησοῦς: yesu-, Τιμόθεος: timotheyaḥ, ὁ: saḥ, ἀδελφός: bhrātā, Φιλήμων: philemonāya, ἀγαπητός: hṛdyāya, συνεργός: sahāyine, ἐγώ: asmākam}
