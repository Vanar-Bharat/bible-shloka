Phlm.1.5:
  map: {ἀκούω: śṛṇvan, σύ: te, ἀγάπη: prema, πίστις: śraddhām, ἔχω: yā (relative), πρός: prati, κύριος: svāminam, Ἰησοῦς: iēsūn, εἰς: prati, πᾶς: sarvān, ἅγιος: sataḥ}
  note: "Chiastic order kept: love and faith; toward all the saints (tathā); faith toward the Lord Jesus (yā). ἣν ἔχεις carried by the relative yā."
