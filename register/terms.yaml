# Concept register, pilot seed. grade: equivalent | partial | none | kept-as-sound
# status: draft until ratified by Ashank; reviewer column filled by a non-Anthropic model.
- id: H430
  source: אֱלֹהִים (elohim)
  render: elohīm (एलोहीम्)
  grade: kept-as-sound
  note: Divine title kept as sound per ratified rule. Plural form, singular verb in Gen 1:1.
  bhashya: Compare Īśvara (partial). Do not substitute.
- id: H1254
  source: בָּרָא (bara)
  render: sasarja (sṛj, perfect)
  grade: partial
  note: Bara has only God as subject. Sanskrit sṛj often implies emanation from prakṛti. Flag for bhāṣya.
- id: H8414+H922
  source: תֹהוּ וָבֹהוּ (tohu va-vohu)
  render: śūnyā rūpahīnā
  grade: partial
  note: Avoided nirākāra (carries Vedāntic sense of the formless Brahman).
- id: H8415
  source: תְּהוֹם (tehom)
  render: arṇava
  grade: partial
  note: "Face of the deep" compressed to arṇave (on the deep). Restore pnei if reviewer rejects.
- id: H7307
  source: רוּחַ (ruach)
  render: rūakh (रूअख़्)
  grade: kept-as-sound
  gender: feminine (follows Hebrew; ratified rule: loanwords keep source gender)
  note: Wind, breath and spirit at once. Kept to preserve the ambiguity.
- id: H7363
  source: מְרַחֶפֶת (merachefet)
  render: plavamānā (feminine, agreeing with rūakh)
  grade: partial
  note: Hover, flutter (used of an eagle in Deut 32:11). Review 1 says plu suggests floating. Kept pending Sanskrit reviewer - plu is believed to cover birds hovering (Monier-Williams; not verified here).
- id: H216
  source: אוֹר (or)
  render: jyotis
  grade: equivalent
- id: H2896
  source: טוֹב (tov)
  render: śubha
  grade: partial
  note: Tov spans good, fitting, beautiful.
- id: H3117+H259
  source: יוֹם אֶחָד (yom echad)
  render: ekaṃ dinam
  grade: equivalent
  note: Cardinal "one", not ordinal "first". Kept cardinal.
- id: G3056
  source: λόγος (logos)
  render: logos (लोगोस्), uninflected, masculine
  grade: kept-as-sound
  bhashya: Vāk, Śabda-brahman (partial). Hebrew background davar.
- id: G2316
  source: θεός (theos)
  render: theos (थेओस्)
  grade: kept-as-sound
  note: Changed from elohīm after review 1. Each book keeps its own source word (ratified rule 3-4). The Gen 1:1 / John 1:1 link goes in the bhāṣya.
- id: G2316-predicate
  source: θεὸς ἦν ὁ λόγος (John 1:1c)
  render: theos āsīt sa logos ca
  grade: equivalent
  note: Greek word order kept (theos first, anarthrous). svayam removed after review 1.
- id: G4314
  source: πρὸς τὸν θεόν (pros ton theon)
  render: theos-pārśve
  grade: partial
  note: "Towards/with God", relational. pārśva = side, nearness.
- id: G2222
  source: ζωή (zoe)
  render: jīvana
  grade: partial
  note: Avoided jīva (the individual soul in Vedānta).
- id: G2638
  source: κατέλαβεν (katelaben)
  render: jagrāha (perfect of grah)
  grade: equivalent
  note: Grasp / overcome / comprehend. grah keeps the same ambiguity. Draft 1 form agṛhṇata was wrong (review 1); corrected.
- id: John1.3-4-punctuation
  source: ὃ γέγονεν (ho gegonen)
  render: attached to 1:3
  grade: n/a
  note: Textual question. Modern critical editions often attach it to 1:4 ("what came to be in him was life"). Draft follows the 1:3 reading. Bhāṣya must state both.
- id: Gen1.1-John1.1-beginning
  source: בְּרֵאשִׁית / ἐν ἀρχῇ
  render: ādau (both)
  grade: equivalent
  note: Same Sanskrit word in both openings so the echo is audible (review 1).
- id: metre-fillers
  source: none
  render: tu, eva, ca, vai, hi, tathā where marked
  grade: n/a
  note: Particles added for metre, not in source. To be listed per verse in the apparatus.
